
name: TaskFlow CI-CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            anurag25200400/taskflow-frontend:v1
            anurag25200400/taskflow-frontend:latest

      - name: Build and Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            anurag25200400/taskflow-backend:v1
            anurag25200400/taskflow-backend:latest

      - name: Deploy with Docker Compose
        run: |
          docker compose -f docker-compose.deploy.yml up -d --wait

      - name: Verify Deployment
        run: |
          curl --fail http://localhost:3002/health
          curl --fail http://localhost:8081/

      - name: Stop Test Deployment
        if: always()
        run: docker compose -f docker-compose.deploy.yml down
